  <!DOCTYPE html>
<html>
<body>

<h2>Book Your Band - 8.2 Test</h2>

<button onclick="sendTest()">SEND TEST BOOKING</button>

<p id="result"></p>

<script>
async function sendTest() {
  const result = document.getElementById("result");
  result.textContent = "Sending...";

  const response = await fetch(
    "/.netlify/functions/send-booking-notification",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        artistName: "Book Your Band Test Artist",
        venueName: "Book Your Band Test Venue",
        contactName: "Ron",
        email: "roncgfs@gmail.com",
        phone: "604-555-0100",
        bookingDate: "2026-08-08",
        message: "Milestone 7 - 8.2 notification test."
      })
    }
  );

  const data = await response.json();

  if (response.ok) {
    result.textContent = "SUCCESS - Booking notification sent.";
  } else {
    result.textContent =
      "FAILED - " + (data.error || JSON.stringify(data));
  }
}
</script>

</body>
</html>
