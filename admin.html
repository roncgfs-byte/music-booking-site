<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Sign In | Book Your Band</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #5A1622;
      color: #F5F0E6;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    .admin-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
      border: 2px solid #F5F0E6;
      border-radius: 10px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      padding: 12px 24px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    #loginMessage {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="admin-box">

    <h1>Book Your Band</h1>
    <h2>Admin Sign In</h2>

    <form id="adminLoginForm">

      <input
        type="email"
        id="adminEmail"
        placeholder="Email address"
        required
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        required
      >

      <br>

      <button type="submit">Sign In</button>

    </form>

    <p id="loginMessage"></p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <script>
    const adminLoginForm = document.getElementById("adminLoginForm");
    const loginMessage = document.getElementById("loginMessage");

    adminLoginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      loginMessage.textContent = "Signing in...";

      const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        loginMessage.textContent = "Unable to sign in. Please check your email and password.";
        return;
      }

      loginMessage.textContent = "Sign in successful.";
      window.location.href = "admin-dashboard.html";
    });
  </script>

</body>
</html>
