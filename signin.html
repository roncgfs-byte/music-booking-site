<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Sign In | Book Your Band</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-container">

<h1>Artist Sign In</h1>

<form id="artist-login">

<p>
<label>Email</label><br>
<input type="email" id="email" required>
</p>

<p>
<label>Password</label><br>
<input type="password" id="password" required>
</p>

<p>
<button type="submit" class="hero-button">
Sign In
</button>
</p>

</form>

<p id="message"></p>
<p>
<a href="#" id="forgot-password">Forgot your password?</a>
</p>
<p>
<a href="apply.html">New Artist? Register Here</a>
</p>

<p>
<a href="index.html">Return Home</a>
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
document.getElementById("forgot-password").addEventListener("click", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message");

  if (!email) {
    message.style.color = "red";
    message.textContent =
      "Please enter your email address first, then click Forgot your password?";
    return;
  }

  message.style.color = "";
  message.textContent = "Sending password reset email...";

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://bookyourband.ca/reset-password.html"
  });

  if (error) {
    message.style.color = "red";
    message.textContent =
      "Unable to send password reset email: " + error.message;
    return;
  }

  message.style.color = "green";
  message.style.fontWeight = "bold";
  message.textContent =
    "✓ Password reset email sent. Please check your inbox.";
});
</script>
</body>
</html>
