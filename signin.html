<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Sign In | Book Your Band</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<!-- NAVIGATION -->
<nav class="main-nav" style="background-color:#5A1622; padding:10px; text-align:center;">
  <div style="color:#F5F0E6; font-weight:bold; display:inline-block; margin-right:20px;">
    Book Your Band
  </div>

  <a href="index.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Home</a>
  <a href="about.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">About Us</a>
  <a href="apply.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Artists</a>
  <a href="venue-register.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Venues</a>
  <a href="contact.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Contact Us</a>
</nav>
<div class="page-container">

<h1>Artist Sign In</h1>

<form id="artist-login">

<p>
<label>Email</label><br>
<input type="email" id="email" required>
</p>

<p>
<label>Password</label><br>
<input type="password" id="password" required>
</p>

<p>
<button type="submit" class="hero-button">
Sign In
</button>
</p>

</form>

<p id="message"></p>
<p>
<a href="#" id="forgot-password">Forgot your password?</a>
</p>
<p>
<a href="apply.html">New Artist? Register Here</a>
</p>

<p>
<a href="index.html">Return Home</a>
</p>

</div>
<footer style="background:#5A1622; color:#F5F0E6; padding:6px 10px; text-align:center; margin-top:0; width:100%; box-sizing:border-box;">
  <p style="color:#F5F0E6; margin:1px 0; font-size:13px;">© 2026 Book Your Band</p>
  <p style="color:#F5F0E6; margin:1px 0; font-size:13px;">Connecting Artists and Venues for Live Music</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
document.getElementById("forgot-password").addEventListener("click", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message");

  if (!email) {
    message.style.color = "red";
    message.textContent =
      "Please enter your email address first, then click Forgot your password?";
    return;
  }

  message.style.color = "";
  message.textContent = "Sending password reset email...";

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://bookyourband.ca/reset-password.html"
  });

  if (error) {
    message.style.color = "red";
    message.textContent =
      "Unable to send password reset email: " + error.message;
    return;
  }

  message.style.color = "green";
  message.style.fontWeight = "bold";
  message.textContent =
    "✓ Password reset email sent. Please check your inbox.";
});
</script>
</body>
</html>
