  <meta charset="UTF-8">

</head>

<body style="font-family: Arial;">
<!-- NAVIGATION -->
<nav class="main-nav" style="background-color:#5A1622; padding:10px; text-align:center;">
  <div style="color:#F5F0E6; font-weight:bold; display:inline-block; margin-right:20px;">
    Book Your Band
  </div>

  <a href="index.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Home</a>
  <a href="about.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">About Us</a>
  <a href="apply.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Artists</a>
  <a href="venue-register.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Venues</a>
  <a href="contact.html" style="color:#F5F0E6; text-decoration:none; margin:0 12px;">Contact Us</a>

<form name="venue-preferences" method="POST" data-netlify="true">
<input type="hidden" name="form-name" value="venue-preferences">
<input type="hidden" name="status" value="New">

<div class="page-container">
  <h1>Venue Booking Details</h1>
  <p>Provide additional information to help us match you with the right artists.</p>

  <p>
    <label>Email (same as application):<br>
    <input type="email" name="email" required></label>
  </p>

  <p>
    <label>Venue Type:<br>
    <input type="text" name="venue_type"></label>
  </p>

  <p>
    <label>Capacity:<br>
    <input type="text" name="capacity"></label>
  </p>

  <p>
    <label>Preferred Music Styles:<br>
    <input type="text" name="music_styles"></label>
  </p>

  <p>
    <label>Event Types:<br>
    <input type="text" name="event_types"></label>
  </p>

  <p>
    <label>Typical Budget:<br>
    <input type="text" name="budget"></label>
  </p>

  <p>
    <label>Available Dates:<br>
    <input type="text" name="availability"></label>
  </p>

  <p>
    <label>Stage / Sound Info:<br>
    <textarea name="tech"></textarea></label>
  </p>

  <p>
    <button type="submit">Submit Details</button>
  </p>

</div>

</form>
<footer style="background:#5A1622; color:#F5F0E6; padding:6px 10px; text-align:center; margin-top:0; width:100%; box-sizing:border-box;">
  <p style="color:#F5F0E6; margin:1px 0; font-size:13px;">© 2026 Book Your Band</p>
  <p style="color:#F5F0E6; margin:1px 0; font-size:13px;">Connecting Artists and Venues for Live Music</p>
</footer>
  
</body>
</html>
