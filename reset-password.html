<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Book Your Band</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</head>

<body>

<div class="page-container">

<h1>Reset Your Password</h1>

<p>
Enter your new password below.
</p>

<form id="reset-password-form">

<p>
<label for="new-password">New Password</label><br>
<input
  type="password"
  id="new-password"
  minlength="8"
  required
>
</p>

<p>
<label for="confirm-password">Confirm New Password</label><br>
<input
  type="password"
  id="confirm-password"
  minlength="8"
  required
>
</p>

<p>
<button type="submit" class="hero-button">
Save New Password
</button>
</p>

</form>

<p id="message"></p>

<p>
<a href="signin.html">Return to Artist Sign In</a>
</p>

<p>
<a href="index.html">Return Home</a>
</p>

</div>

<script>
const resetForm = document.getElementById("reset-password-form");
const message = document.getElementById("message");

resetForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const newPassword =
    document.getElementById("new-password").value;

  const confirmPassword =
    document.getElementById("confirm-password").value;

  if (newPassword !== confirmPassword) {
    message.style.color = "red";
    message.textContent = "The passwords do not match.";
    return;
  }

  message.textContent = "Updating password...";

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword
  });

  if (error) {
    message.style.color = "red";
    message.textContent =
      "Unable to update password: " + error.message;
    return;
  }

  message.style.color = "green";
  message.style.fontWeight = "bold";
  message.textContent =
    "✓ Password updated successfully. You may now sign in with your new password.";
});
</script>

</body>
</html>
