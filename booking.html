<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Request a Booking</title>
</head>

<body style="font-family: Arial; text-align: center;">

<h1>Request a Booking</h1>

<div style="max-width: 500px; margin: auto; text-align: center;">

<form name="booking-request" method="POST" data-netlify="true">

<input type="hidden" name="form-name" value="booking-request">

<p>
<label>Name:<br>
<input type="text" name="name" required></label>
</p>

<p>
<label>Email:<br>
<input type="email" name="email" required></label>
</p>

<p>
<label>Are you Artist or Venue?<br>
<input type="text" name="type"></label>
</p>
<p>
<p>
<label>Select Artist:<br>
<select name="artist_name" id="artist_name">
  <option value="">Loading artists...</option>
</select>
</label>
</p>
  <div id="artistProfile" style="display:none; margin:20px auto; padding:15px; border:1px solid #ccc; border-radius:8px; background:#fff8e8; text-align:left; max-width:600px;">

<h3>Artist Profile</h3>

<p><strong>Artist:</strong> <span id="profileArtist"></span></p>

<p><strong>City:</strong> <span id="profileCity"></span></p>

<p><strong>Music Styles:</strong> <span id="profileMusic"></span></p>

<p><strong>Equipment:</strong> <span id="profileEquipment"></span></p>

<p><strong>Available Days:</strong> <span id="profileAvailability"></span></p>

<p><strong>YouTube Links:</strong></p>

<ul>
  <li><a id="yt1" target="_blank"></a></li>
  <li><a id="yt2" target="_blank"></a></li>
  <li><a id="yt3" target="_blank"></a></li>
  <li><a id="yt4" target="_blank"></a></li>
</ul>

</div>
<p>
<p>
<label>Preferred Booking Date:<br>
<input type="date" name="booking_date"></label>
</p>
  <p>
<label>Event Title:<br>
<input type="text" name="title" required></label>
</p>

<p>
<label>Music Style Required:<br>
<input type="text" name="music_style"></label>
</p>

<p>
<label>Budget (CAD):<br>
<input type="number" name="budget" min="0"></label>
</p>

<p>
<label>Start Time:<br>
<input type="time" name="start_time"></label>
</p>

<p>
<label>End Time:<br>
<input type="time" name="end_time"></label>
</p>
<label>Details:<br>
<textarea name="details"></textarea></label>
</p>

<p>
<button type="submit">Submit</button>
</p>
<h2>Booking Status</h2>

<table id="venueBookings" border="1" cellpadding="8" cellspacing="0"
style="border-collapse:collapse; width:100%;">

<thead>
<tr>
<th>Artist</th>
<th>Event</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody>

</tbody>

</table>
</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
